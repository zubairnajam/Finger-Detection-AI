[project]
name = "finger-detection-ai"
version = "2.0.0"
description = "Real-time gesture-controlled smart camera: MediaPipe hand landmarks + MLP finger-count classifier."
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["archive", "data", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP007", "UP045"]
